name: 'Artifactory Token (vendor)'
description: 'Exchange a GitHub OIDC token with the credential vendor for a short-lived Artifactory token, and export RTC_CPP_ARTIFACTORY_TOKEN'

inputs:
  vendor-url:
    description: 'Vendor Function URL, e.g. https://<service>.twil.io/vendor'
    required: true
  audience:
    description: 'OIDC audience the vendor expects. Must equal its GITHUB_OIDC_AUDIENCE.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Exchange OIDC token with the credential vendor
      shell: bash
      env:
        VENDOR_URL: ${{ inputs.vendor-url }}
        VENDOR_AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail

        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required by the artifactory-token-vendor action but was not found on the runner."
          exit 1
        fi
        for var in VENDOR_URL VENDOR_AUDIENCE; do
          if [ -z "${!var}" ]; then
            echo "::error::${var} is empty."
            exit 1
          fi
        done

        # 1. A GitHub OIDC JWT for the vendor's audience. The vendor checks the
        #    repository, workflow and ref claims before it mints anything.
        # curl encodes and appends the audience: interpolating it into the query
        # would truncate one containing & or #, minting a token with the wrong aud.
        GITHUB_JWT=$(curl -sSf -G \
          --data-urlencode "audience=${VENDOR_AUDIENCE}" \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
          | jq -r '.value')
        echo "::add-mask::$GITHUB_JWT"

        if [ -z "$GITHUB_JWT" ] || [ "$GITHUB_JWT" = "null" ]; then
          echo "::error::Failed to obtain a GitHub OIDC JWT. Check that the job grants id-token: write."
          exit 1
        fi

        # 2. Ask the vendor to mint. The JWT goes in through a curl config file
        #    on stdin rather than argv, so it cannot reach a process listing.
        RAW=$(printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_JWT" | curl -sS -w '\n%{http_code}' \
          --config - \
          -H 'Content-Type: application/json' \
          -d '{"action":"mint-artifactory-token"}' \
          "${VENDOR_URL}")
        HTTP_CODE=$(printf '%s' "$RAW" | tail -n 1)
        RESP=$(printf '%s' "$RAW" | sed '$d')
        ART_TOKEN=$(printf '%s' "$RESP" | jq -r '.token // empty' 2>/dev/null || true)

        if [ -z "$ART_TOKEN" ]; then
          echo "::error::Vendor did not return a token (HTTP ${HTTP_CODE}). Redacted response below:"
          echo "$RESP" | jq 'walk(if type == "object" then with_entries(if (.key | test("token"; "i")) then .value = "<redacted>" else . end) else . end)' 2>/dev/null \
            || echo "::error::(response withheld — not valid JSON)"
          exit 1
        fi
        echo "::add-mask::$ART_TOKEN"

        # 3. Available to later steps in this job, for fetch-deps. The vendor
        #    caps the lifetime, so fetch the dependency soon after this runs.
        echo "RTC_CPP_ARTIFACTORY_TOKEN=$ART_TOKEN" >> "$GITHUB_ENV"
        echo "::notice::RTC_CPP_ARTIFACTORY_TOKEN obtained from the credential vendor"
