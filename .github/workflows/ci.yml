name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  check:
    name: ${{ matrix.name }}
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-x64
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: |
              npm run lint
              npm run format:check
          - name: typecheck
            # test/bundle.test.ts imports ../dist/index.mjs, so the bundle has to
            # exist before tsc runs.
            run: |
              npm run build:ts
              npm run typecheck
          - name: build-and-test
            # The unit tests require the native addon. Run them under coverage
            # so the thresholds in vitest.config.ts are actually enforced: a
            # deleted or silently-skipped test file shows up here as a coverage
            # drop, and vitest exits 0 both when a named test file is missing
            # and when one is removed.
            native: true
            run: |
              npm run build:ts
              npm run test:coverage
          - name: unit-pure
            # The suites that do not load the addon, so they run without rtc-cpp.
            run: |
              npm run build:ts
              npm run test:unit:pure
          - name: examples
            # Examples are shipped code and the documented reproduction path in
            # CONTRIBUTING.md. They import the built .d.cts, so a removed or
            # renamed SDK method fails here instead of silently at runtime.
            run: |
              npm run build:ts
              npm run check:examples
          - name: docs
            run: npm run docs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Ahead of the OIDC step so the npm cache is restored before .npmrc points
      # at Artifactory. Keep node-version pinned, and move engines.node with it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14'
          cache: npm
      - name: Artifactory OIDC Auth
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/artifactory-oidc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # The tarball's token is minted by the credential vendor, separately from
      # npm's, so it can be scoped to the repository holding it.
      - name: Artifactory token for rtc-cpp
        if: ${{ matrix.native }}
        uses: ./.github/actions/artifactory-token-vendor
        with:
          vendor-url: ${{ vars.RTC_CPP_TOKEN_VENDOR_URL }}
          audience: ${{ vars.RTC_CPP_TOKEN_VENDOR_AUDIENCE }}
      # Not cached: rtc-cpp is not redistributable, and GitHub caches are
      # readable by any workflow run on the repository.
      - name: Fetch rtc-cpp
        if: ${{ matrix.native }}
        run: npm run fetch-deps
      # CMakeLists links these on Linux; the runner image does not carry them.
      - name: Install X11 development libraries
        if: ${{ matrix.native }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxcomposite-dev libxrandr-dev libxtst-dev
      - name: Build native addon
        if: ${{ matrix.native }}
        run: npm run build
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
