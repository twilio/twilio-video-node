name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  check:
    name: ${{ matrix.name }}
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-x64
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: |
              npm run lint
              npm run format:check
          - name: build-and-test
            # The unit tests require the native addon.
            native: true
            run: |
              npm run build:ts
              npm run test:unit
          - name: docs
            run: npm run docs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Ahead of the OIDC step so the npm cache is restored before .npmrc points
      # at Artifactory. Keep node-version pinned, and move engines.node with it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14'
          cache: npm
      - name: Artifactory OIDC Auth
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/artifactory-oidc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Not cached: rtc-cpp is not redistributable, and GitHub caches are
      # readable by any workflow run on the repository.
      - name: Fetch rtc-cpp
        if: ${{ matrix.native }}
        run: npm run fetch-deps
      - name: Build native addon
        if: ${{ matrix.native }}
        run: npm run build
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
