name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  check:
    name: ${{ matrix.name }}
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ${{ matrix.runs-on || 'ubuntu-x64' }}
    permissions:
      contents: read
      id-token: write
    env:
      # Set by macOS entries only; see build-and-test (macos).
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: |
              npm run lint
              npm run format:check
          - name: typecheck
            # test/bundle.test.ts imports ../dist/index.mjs, so the bundle has to
            # exist before tsc runs.
            run: |
              npm run build:ts
              npm run typecheck
          - name: build-and-test
            # The unit tests require the native addon. Run them under coverage
            # so the thresholds in vitest.config.ts are actually enforced: a
            # deleted or silently-skipped test file shows up here as a coverage
            # drop, and vitest exits 0 both when a named test file is missing
            # and when one is removed.
            native: true
            run: |
              npm run build:ts
              npm run test:coverage
          - name: build-and-test (macos)
            runs-on: macos-arm
            # rtc-cpp's darwin library is built with Apple clang 17, which this
            # Xcode provides. The image's default Xcode has a newer clang that
            # rejects rtc-cpp's headers.
            developer-dir: /Applications/Xcode_26.0.1.app/Contents/Developer
            native: true
            run: |
              npm run build:ts
              npm run test:coverage
          - name: unit-pure
            # The suites that do not load the addon, so they run without rtc-cpp.
            run: |
              npm run build:ts
              npm run test:unit:pure
          - name: examples
            # Examples are shipped code and the documented reproduction path in
            # CONTRIBUTING.md. They import the built .d.cts, so a removed or
            # renamed SDK method fails here instead of silently at runtime.
            run: |
              npm run build:ts
              npm run check:examples
          - name: docs
            run: npm run docs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Ahead of the OIDC step so the npm cache is restored before .npmrc points
      # at Artifactory. Keep node-version pinned, and move engines.node with it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14'
          cache: npm
      - name: Artifactory OIDC Auth
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/artifactory-oidc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # rtc-cpp ships its darwin library for one compiler
      # (deps/twilio-video/lib/arm64/appleclang-17.0/) and the build does not
      # check it. An image without the pinned Xcode fails here, not mid-build.
      - name: Verify the Apple clang version
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -euo pipefail

          xcodebuild -version
          clang --version

          MAJOR=$(clang --version | sed -nE '1s/^Apple clang version ([0-9]+)\..*/\1/p')
          if [ "$MAJOR" != "17" ]; then
            echo "::error::expected Apple clang 17, got ${MAJOR:-an unrecognized version}. rtc-cpp's darwin library is built with appleclang-17.0. Point DEVELOPER_DIR at an installed Xcode that provides it."
            exit 1
          fi
      # The tarball's token is minted by the credential vendor, separately from
      # npm's, so it can be scoped to the repository holding it.
      - name: Artifactory token for rtc-cpp
        id: rtc-cpp-token
        if: ${{ matrix.native }}
        uses: ./.github/actions/artifactory-token-vendor
        with:
          vendor-url: ${{ vars.RTC_CPP_TOKEN_VENDOR_URL }}
          audience: ${{ vars.RTC_CPP_TOKEN_VENDOR_AUDIENCE }}
      # Not cached: rtc-cpp is not redistributable, and GitHub caches are
      # readable by any workflow run on the repository. The token is scoped to
      # this step so it is not in the environment of the build and test steps.
      - name: Fetch rtc-cpp
        if: ${{ matrix.native }}
        env:
          RTC_CPP_ARTIFACTORY_TOKEN: ${{ steps.rtc-cpp-token.outputs.token }}
        run: npm run fetch-deps
      # CMakeLists links these on Linux; the runner image does not carry them.
      - name: Install X11 development libraries
        if: ${{ matrix.native && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxcomposite-dev libxrandr-dev libxtst-dev
      - name: Build native addon
        if: ${{ matrix.native }}
        run: npm run build
      - name: Verify DT_NEEDED and ABI floors
        if: ${{ matrix.native && runner.os == 'Linux' }}
        run: scripts/check-linux-abi.sh build/Release/twilio_video_sdk_node.node
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      # Pinned so a new 26.x cannot turn main red.
      - name: Unit tests on Node 26
        if: ${{ matrix.name == 'build-and-test' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.13'
      - name: Run unit tests on Node 26
        if: ${{ matrix.name == 'build-and-test' }}
        run: |
          node --version
          npm run test:unit
      # Real loader in real images; test/module_load mocks glibc.
      - name: Check supported and unsupported Linux images
        if: ${{ matrix.name == 'build-and-test' }}
        run: |
          set -euo pipefail

          LOAD='require("./dist/index.cjs"); process.exit(0)'

          # Slim images ship no package lists and no libX11.
          for IMAGE in \
            node:26-slim@sha256:5adad64f9a1fca2d51972caa65983634c8a774eb300d72b20f7f2a0f60368072 \
            node:24-trixie-slim@sha256:0820eaa85e07d0490446dd01d14707e17e6108a36988cf374899cd057eb3812d
          do
            echo "::group::${IMAGE} must load"
            docker run --rm -v "$PWD":/w -w /w "$IMAGE" \
              sh -c "apt-get update -qq && apt-get install -y -qq libx11-6 && node -e '${LOAD}'"
            echo '::endgroup::'
          done

          expect_load_failure() {
            local IMAGE="$1"; shift
            local OUTPUT
            echo "::group::${IMAGE} must fail to load"
            OUTPUT=$(docker run --rm -v "$PWD":/w -w /w "$IMAGE" node -e "$LOAD" 2>&1) && LOADED=1 || LOADED=0
            echo "$OUTPUT"
            echo '::endgroup::'
            if [ "$LOADED" = 1 ]; then
              echo "::error::${IMAGE} loaded the package but is not a supported image."
              exit 1
            fi
            for EXPECTED in "$@"; do
              if ! grep -qF "$EXPECTED" <<<"$OUTPUT"; then
                echo "::error::${IMAGE} failed to load, but the output does not contain '${EXPECTED}'."
                exit 1
              fi
            done
          }

          # Node 24 on Debian 12: glibc 2.36, below the floor.
          expect_load_failure node:24@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40 \
            UnsupportedPlatformError 'glibc 2.36 is too old'
          # musl.
          expect_load_failure node:26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216 \
            NativeBindingLoadError
