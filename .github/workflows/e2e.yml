name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only PR runs are cancelled, so every commit on main gets a run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  integration:
    name: integration
    # Fork pull requests get no OIDC token.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-x64
    timeout-minutes: 60
    environment: e2e
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Ahead of the OIDC step so the npm cache is restored before .npmrc points
      # at Artifactory. Keep node-version in step with ci.yml.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14'
          cache: npm
      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Artifactory token for rtc-cpp
        id: rtc-cpp-token
        uses: ./.github/actions/artifactory-token-vendor
        with:
          vendor-url: ${{ vars.RTC_CPP_TOKEN_VENDOR_URL }}
          audience: ${{ vars.RTC_CPP_TOKEN_VENDOR_AUDIENCE }}
      - name: Fetch rtc-cpp
        env:
          RTC_CPP_ARTIFACTORY_TOKEN: ${{ steps.rtc-cpp-token.outputs.token }}
        run: npm run fetch-deps
      - name: Install X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxcomposite-dev libxrandr-dev libxtst-dev
      - name: Build native addon
        run: npm run build
      # The child-process tests load dist/index.cjs.
      - name: Build the bundle
        run: npm run build:ts
      - name: Integration tests
        env:
          VENDOR_URL: ${{ vars.VENDOR_URL_PROD }}
        run: |
          if [ -z "$VENDOR_URL" ]; then
            echo "::error::vars.VENDOR_URL_PROD is not set for the e2e environment."
            exit 1
          fi
          npm run test:integration
